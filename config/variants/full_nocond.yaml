# MIDAS-style design with every regulariser: decoders blind to the source,
# supervised blocks, bounded (confusion) leakage discriminators and CKA
# independence constraints. Base of the penalty-strength sweep.
model:
  factors:
    model_type:
      supervised_weight: 1.0
      adversarial_weight: 0.1
      adversarial_mode: confusion
      hsic_weight: 5.0
    tissue: {supervised_weight: 1.0, adversarial_weight: 0.05, adversarial_mode: confusion, hsic_weight: 2.0}
    emt: {supervised_weight: 1.0, hsic_weight: 2.0}
  block_hsic_weight: 1.0
  decoder_conditionals: [tissue, mutations]
  adversarial_warmup_epochs: 10
