# MOSA's adversarial branch with the bounded "confusion" objective (encoder
# pushes the discriminator towards a uniform prediction) instead of
# maximising the discriminator loss.
model:
  free_dim: 64
  factors:
    model_type: {block_dim: 0, adversarial_weight: 0.1, adversarial_mode: confusion}
    tissue: {block_dim: 0}
    emt: {block_dim: 0}
